name: Live zetten op Strato

# Bij elke wijziging op main: testen, bouwen en via SFTP naar pichya.nl (Strato-webhosting met PHP).
# Nodig: het geheim STRATO_SFTP_PASSWORD (Settings → Secrets and variables → Actions). Doelmap: deploy/strato.json.
# Is de doelmap nog leeg, dan wordt alleen getoond welke mappen er op de hosting staan (niets geüpload).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: strato

env:
  SFTP_HOST: 5021648507.ssh.w2.strato.hosting
  SFTP_USER: su707245

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testen en bouwen
        run: |
          npm ci
          npm test
          php tests/sessies.php
          npx tsc --noEmit
          npx next build
          node scripts/build-site.mjs
          test -f out/index.html && test -f out/login.html && test -f out/api/nd.php && test -f out/api/_private/.htaccess
      - name: Geheim aanwezig?
        id: s
        env:
          PW: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "STRATO_SFTP_PASSWORD ontbreekt: niets geüpload."; echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
          echo "dir=$(node -e 'console.log(require("./deploy/strato.json").dir||"")')" >> $GITHUB_OUTPUT
          echo "cleanup=$(node -e 'console.log(require("./deploy/strato.json").cleanupRoot?"yes":"no")')" >> $GITHUB_OUTPUT
      - name: Uploaden
        if: steps.s.outputs.go == 'yes'
        env:
          LFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          DIR: ${{ steps.s.outputs.dir }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          L="set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; open --env-password -u $SFTP_USER sftp://$SFTP_HOST"
          if [ -z "$DIR" ]; then
            echo "Doelmap nog niet ingesteld. Inhoud van de hosting:"
            lftp -c "$L; cls -la /; cls -la /*/"
            exit 0
          fi
          # Instellingen (config.php) en tijdelijke bestanden op de server nooit overschrijven of weggooien.
          # Sneller: _next en de lijsten niet dubbel, en de lijsten (20 MB) alleen opnieuw als een bestand echt veranderd is.
          lftp -c "$L; mkdir -pf $DIR; mirror -R --no-perms --parallel=4 -x '^_next/' -x '^api/_private/lists/' --exclude-glob api/_private/config.php --exclude-glob 'api/_private/download.*' out/ $DIR/; mirror -R --delete --no-perms --parallel=4 out/_next/ $DIR/_next/; mirror -R --delete --no-perms --parallel=4 --ignore-time out/api/_private/lists/ $DIR/api/_private/lists/"
      - name: Oude kopie in de hoofdmap opruimen (eenmalig; alleen bekende Klaro-bestanden, nooit de map klaro)
        if: steps.s.outputs.go == 'yes' && steps.s.outputs.cleanup == 'yes'
        env:
          LFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          L="set sftp:auto-confirm yes; set cmd:fail-exit no; open --env-password -u $SFTP_USER sftp://$SFTP_HOST"
          lftp -c "$L; rm -rf /_next /_not-found /api /login; rm -f /.htaccess /404.html /index.html /index.txt /login.html /login.txt /_not-found.html /_not-found.txt /__next.__PAGE__.txt /__next._full.txt /__next._tree.txt; cls -la /"
      - name: Controleren
        if: steps.s.outputs.go == 'yes' && steps.s.outputs.dir != ''
        run: |
          for i in $(seq 1 10); do
            a=$(curl -s -o /dev/null -w '%{http_code}' https://pichya.nl/login || true)
            b=$(curl -s -o /dev/null -w '%{http_code}' https://pichya.nl/api/nd.php || true)
            c=$(curl -s -o /dev/null -w '%{http_code}' https://pichya.nl/api/_private/.htaccess || true)
            d=$(curl -s -o /dev/null -w '%{http_code}' https://pichya.nl/ || true)
            e=$(curl -s -o /dev/null -w '%{http_code}' https://pichya.nl/api/common.php || true)
            echo "login=$a api=$b privaat=$c pagina-zonder-inlog=$d hulpbestand=$e"
            if [ "$a" = 200 ] && { [ "$b" = 401 ] || [ "$b" = 503 ]; } && [ "$c" = 403 ] && [ "$d" = 303 ] && [ "$e" = 403 ]; then echo "pichya.nl werkt"; exit 0; fi
            sleep 5
          done
          echo "--- diagnose ---"
          getent hosts pichya.nl www.pichya.nl || echo "pichya.nl heeft geen adres (DNS)"
          curl -sv -m 15 -o /dev/null http://pichya.nl/login 2>&1 | grep -E '^\*|^< HTTP|^< Location' | head -15 || true
          curl -sv -m 15 -o /dev/null https://pichya.nl/login 2>&1 | grep -E '^\*|^< HTTP' | head -15 || true
          echo "--- inhoud via http ---"
          curl -s -m 15 http://pichya.nl/login | head -c 300; echo
          for u in /login /api/nd.php /api/_private/.htaccess /api/setup.php; do curl -s -m 15 -o /dev/null -w "http $u %{http_code}\n" http://pichya.nl$u || true; done
          exit 1
