name: Dagelijks leren en bewaken

# 1. Leren vastleggen (los van de Claude-controle): wat Klaro nu uit de logboeken afleidt (widgets/open tabbladen, vaste hulpjes)
#    vastzetten in lib/geleerd.ts (scripts/leer.ts), zodat het blijft als het NextDNS-logboek wordt leeggemaakt, en de
#    referentiegevallen tegen de echte site controleren. Nodig: het geheim KLARO_PW (Settings → Secrets and variables → Actions).
#    Ontbreekt dat, dan wordt deze stap overgeslagen met een melding.
# 2. Bewaken: heeft de dagelijkse Claude-controle vandaag gedraaid? Die schrijft docs/laatste-controle.md. Staat daar niet de
#    datum van vandaag, dan wordt deze run rood (GitHub meldt dat per e-mail); om 12:47 volgt een inhaalcontrole.
on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: leren

jobs:
  leren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Overzicht van de echte site en vastleggen
        id: leer
        env:
          KLARO_PW: ${{ secrets.KLARO_PW }}
        run: |
          if [ -z "$KLARO_PW" ]; then echo "::warning::KLARO_PW ontbreekt als GitHub-geheim: leren vastleggen overgeslagen (de Claude-controle doet het wel)."; exit 0; fi
          ok=0
          for i in 1 2 3; do node --experimental-strip-types scripts/overzicht.ts > /tmp/overzicht.json && ok=1 && break; sleep 60; done
          [ "$ok" = 1 ] || { echo "Overzicht ophalen mislukt na 3 pogingen."; exit 1; }
          node --experimental-strip-types scripts/leer.ts /tmp/overzicht.json
          node --experimental-strip-types scripts/referentie.ts /tmp/overzicht.json
          echo "klaar=1" >> "$GITHUB_OUTPUT"
      - name: Testen en opslaan als er iets geleerd is
        if: steps.leer.outputs.klaar == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet lib/geleerd.ts; then echo "Niets nieuws geleerd."; exit 0; fi
          npm test && npx tsc --noEmit
          git config user.name "leer-bot"
          git config user.email "leer-bot@users.noreply.github.com"
          git add lib/geleerd.ts
          git commit -m "Geleerd vastgelegd ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
          gh workflow run strato.yml --ref main

  bewaken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heeft de dagelijkse controle vandaag gedraaid?
        run: |
          vandaag=$(TZ=Europe/Amsterdam date +%Y-%m-%d)
          laatst=$(grep -m1 -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' docs/laatste-controle.md 2>/dev/null || echo "nooit")
          echo "Laatste dagelijkse controle: $laatst (vandaag: $vandaag)"
          [ "$laatst" = "$vandaag" ] || { echo "::error::De dagelijkse controle heeft vandaag niet (goed) gedraaid. Om 12:47 volgt een inhaalcontrole."; exit 1; }
