name: Tests

# Bij elke wijziging: alle controles (vangnet, echt gebruik, mail) en de typecheck.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next build
      # Het vangnet werkt alleen als de 18+/dating-lijsten mee gaan naar de server (api/_private/lists).
      - name: Site samenstellen
        run: |
          node scripts/build-site.mjs
          test -f out/api/_private/lists/adult/00.txt && test -f out/api/_private/lists/dating/00.txt
