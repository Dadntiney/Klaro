name: Tests

# Bij elke wijziging: alle controles (vangnet, echt gebruik, mail) en de typecheck.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next build
      # Het vangnet werkt alleen als de 18+/dating-lijsten mee gaan naar élke serverfunctie die adressen beoordeelt.
      - name: Adreslijsten zitten in de serverfuncties
        run: |
          for r in nextdns nextdns/live nextdns/detail audit; do
            grep -q adult-domains ".next/server/app/api/$r/route.js.nft.json" || { echo "Lijst ontbreekt in /api/$r"; exit 1; }
          done
