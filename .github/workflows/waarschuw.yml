# Elke 5 minuten: nieuwe regels beoordelen met dezelfde code als de pagina en bij 18+, dating of VPN een pushmelding sturen
# (scripts/waarschuw.ts). Het geheim is hetzelfde als voor het live zetten; in het logboek staan alleen aantallen.
#
# GitHub start geplande taken vaak laat of helemaal niet (20 okt: na 2 uur nog geen enkele). Daarom draait elke run zelf
# ~5,5 uur lang elke 5 minuten de controle en start dan zijn eigen opvolger. Het uurschema is alleen reserve als die keten
# ooit breekt; handmatig annuleren stopt de keten. Er draait er altijd hooguit één tegelijk (concurrency). Openbare repository: geen kosten.
name: Waarschuwen
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: waarschuwen
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  waarschuw:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Elke 5 minuten nieuwe regels nakijken
        env:
          KLARO_GEHEIM: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            git pull -q --ff-only origin main || true   # nieuwe herkenning meteen gebruiken, niet pas bij de volgende run
            timeout 240 node --experimental-strip-types scripts/waarschuw.ts || echo "deze ronde mislukt"
            sleep $(( 300 - ($(date +%s) - start) > 0 ? 300 - ($(date +%s) - start) : 1 ))
          done
      - name: Opvolger starten
        if: ${{ !cancelled() }}   # handmatig annuleren stopt de keten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run waarschuw.yml --ref main
